server:
  port: 8000

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/auth/**
            - id: account-route
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/accounts/**
            - id: transaction-route
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/api/transactions/**
            - id: notification-route
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - httpexchanges
          - gateway